[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
# We don't include `actionlint` in `dev` because it builds from source and downloads a
# binary from GitHub, which the test matrix in CI doesn't need.
#
# With that in mind, splitting `dev` into `lint` and `test` groups feels like an obvious
# optimisation but it adds more complexity than it's worth:
#
# - `uv run` syncs the default groups, so `just test` would reinstall all of `dev`
#   anyway unless the test job also set `UV_NO_SYNC`.
# - `--only-group test` omits the project itself, so the test job would need
#   `--no-default-groups --group test` instead.
# - `pyright` needs `pytest` to type-check the tests, so the lint job would need both
#   groups anyway.
# - `actionlint-py` would join every contributor's default `uv sync`, which would then
#   fail outright without access to github.com.
#
# `actionlint-py` is a special case because it downloads a binary. We don't need to go
# this far for anything else.
actions = [
  "actionlint-py>=1.7.12.24",
  # We never call `shellcheck` directly; `actionlint` uses it if it's installed, and
  # skips tests if not. So, we install it!
  "shellcheck-py>=0.11.0.1",
]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
  "rumdl>=0.2.73",
  { include-group = "docs" },
]
docs = [
  "mkdocstrings-python>=2.0.8",
  "zensical>=0.0.62",
]

[project]
authors = [{ name = "Cariad Eccleston", email = "cariad@cariad.earth" }]
classifiers = ["Development Status :: 3 - Alpha"]
description = "A directory walker that respects ignore-files"
license = "MIT"
name = "mosey"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[tool.coverage.report]
# This project contains portions of operating system-specific code (for example, code to
# handle specific error conditions in Windows vs Linux vs macOS), so a test run on a
# single machine might not touch every line.
#
# So, 100% coverage isn't always possible locally -- but 90% feels reasonable.
#
# When a pull request is opened against `main`, `.github/workflows/verify.yml` runs the
# tests in Windows, Linux, and macOS runners, then gathers the results and ensures every
# line was tested by at least one operating system before allowing the change to be
# merged.
fail_under = 90
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
# Save coverage results relative to the project so `.github/workflows/verify.yml` can
# combine data from across operating systems
relative_files = true
source = ["mosey"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov"
log_level = "DEBUG"
testpaths = ["tests"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "ANN", # Require all type annotations
  "B",   # flake8-bugbear
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "G",   # flake8-logging-format
  "I",   # isort
  "LOG", # flake8-logging
  "RUF", # ruff's own rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.rumdl]
disable = [
  "MD013", # Maximum line length
]
flavor = "mkdocs" # Understand admonitions, content tabs and autorefs in `docs/`

[tool.rumdl.no-trailing-spaces]
br-spaces = 0 # Don't use trailing whitespace as line breaks

[tool.uv]
# NOTE: uv is pre-1.0 and minor releases may break our usage. Bump this deliberately
# NOTE: after reading the changelog and testing.
required-version = ">=0.12.7, <0.13"

[tool.uv.extra-build-dependencies]
# `actionlint-py` is published as a source distribution and `uv.lock` doesn't pin its
# build dependencies, which include the deprecated `wheel.bdist_wheel` and `distutils`,
# so cap the last versions known to build it.
actionlint-py = [
  "setuptools<85",
  "wheel<0.49",
]
