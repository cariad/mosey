# TEMPORARY -- DO NOT MERGE! Delete this whole file once we've seen it work.
#
# This workflow is deliberately wrong so that `just actions` fails in the "Verify"
# workflow, and we can check that `actionlint` errors are annotated on the pull
# request. It lives in its own file so that `verify.yml` stays untouched and there's
# no doubt that GitHub will run it.
#
# We expect the "Files changed" tab to show an annotation on each of the two `run`
# lines below, and the `just actions` log to show each error prefixed with its file,
# line and column.

name: TEMPORARY actionlint test

on:
  # Never runs by itself; it only exists to be linted. Both steps would be harmless
  # if someone did run it.
  workflow_dispatch:

permissions: {}

jobs:
  deliberately-wrong:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # `$GITHUB_OUTPUT` is unquoted, which `shellcheck` reports as SC2086. This also
      # proves that `actionlint` finds the `shellcheck` that we install.
      - run: echo "v=1" >> $GITHUB_OUTPUT

      # There's no step with the ID `nope`, which `actionlint` reports itself.
      - run: echo "${{ steps.nope.outputs.y }}"
