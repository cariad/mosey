name: Verify

on:
  # GitHub branch rules prevent pushing directly to `main` and require
  # pull requests, so we only need to validate those.
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    env:
      # Annotate `actionlint` warnings on the pull request:
      ACTIONLINT_FORMAT: "{{ range $err := . }}::error file={{ $err.Filepath }},line={{ $err.Line }},col={{ $err.Column }}::{{ $err.Filepath }}:{{ $err.Line }}:{{ $err.Column }}: {{ $err.Message }} [{{ $err.Kind }}]\n{{ end }}"
      # Annotate `ruff` warnings on the pull request:
      RUFF_OUTPUT_FORMAT: github
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-python: true

      # Build `actionlint-py` here so that a failure to download its binary fails the
      # setup rather than the check itself, for clarity.
      - run: uv sync --locked --group actions

      - id: just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      # Run every check even when an earlier one fails, so a single push
      # surfaces all the problems at once. Skip them if setup failed.
      - if: &not-cancelled ${{ !cancelled() && steps.just.outcome == 'success' }}
        run: just actions

      # The API reference is generated from docstrings, so a source change
      # can break the site. Build it here rather than discover that on `main`.
      - if: *not-cancelled
        run: just docs

      - if: *not-cancelled
        run: just lint

      - if: *not-cancelled
        run: just markdown

      - if: *not-cancelled
        run: just typing

  test:
    env:
      # Give each job's coverage data a unique name so the `coverage` job can gather
      # them all into one directory.
      COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-python: true
          python-version: "${{ matrix.python-version }}"

      - run: uv sync --locked

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      - run: just test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          # The coverage data file is a dotfile:
          include-hidden-files: true
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ env.COVERAGE_FILE }}
          retention-days: 1

  # This project contains portions of operating system-specific code (for example, code
  # to handle specific error conditions in Windows vs Linux vs macOS), so a test run on
  # a single machine might not touch every line.
  #
  # So, here in CI, we run the tests in a matrix of operating systems, gather their
  # coverage, then assert that every line of code was touched by at least one of them.
  coverage:
    # By default, this job would be skipped if any `test` job fails, and GitHub treats a
    # skipped job as a passed status check.
    #
    # So, always run, then fail explicitly if the tests didn't succeed.
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: ${{ needs.test.result != 'success' }}
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-python: true

      - run: uv sync --locked

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          pattern: coverage-*

      - run: uv run coverage combine
      - run: uv run coverage report --fail-under=100
