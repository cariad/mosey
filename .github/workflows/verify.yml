name: Verify

on:
  # GitHub branch rules prevent pushing directly to `main` and require
  # pull requests, so we only need to validate those.
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    env:
      RUFF_OUTPUT_FORMAT: github
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-python: true

      - run: uv sync --locked

      - id: just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      # Run every check even when an earlier one fails, so a single push
      # surfaces all the problems at once. Skip them if setup failed.
      #
      # The API reference is generated from docstrings, so a source change
      # can break the site. Build it here rather than discover that on `main`.
      - run: just docs

      - if: ${{ !cancelled() && steps.just.outcome == 'success' }}
        run: just lint

      - if: ${{ !cancelled() && steps.just.outcome == 'success' }}
        run: just markdown

      - if: ${{ !cancelled() && steps.just.outcome == 'success' }}
        run: just typing

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-python: true
          python-version: "${{ matrix.python-version }}"

      - run: uv sync --locked

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      - run: just test
