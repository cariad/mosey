[project]
copyright = "&copy; 2026 Cariad Eccleston"
nav = [{ "Get started" = "index.md" }]
repo_name = "cariad/mosey"
repo_url = "https://github.com/cariad/mosey"
site_author = "Cariad Eccleston"
site_description = "A directory walker that respects ignore-files."
site_name = "Mosey documentation"
site_url = "https://cariad.github.io/mosey/"
strict = true

[project.theme]
features = [
  "content.code.copy", # Copy button in code blocks
  "content.tabs.link", # Content tabs that share a label switch together
]

[project.theme.icon]
logo = "lucide/footprints"

[[project.theme.palette]]
media = "(prefers-color-scheme)"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/cariad/"
name = "Cariad Eccleston on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/cariad/"
name = "Cariad Eccleston on LinkedIn"
